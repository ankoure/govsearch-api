services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govsearch-api
    ports:
      - "8000:8000"
    environment:
      # Copy settings from .env or set directly here
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      - OLLAMA_CONTEXT_WINDOW=${OLLAMA_CONTEXT_WINDOW:-4096}
      - OLLAMA_MAX_CHUNKS_FOR_CONTEXT=${OLLAMA_MAX_CHUNKS_FOR_CONTEXT:-5}
    volumes:
      # Mount source code for development (comment out for production)
      - ./app:/app/app
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - govsearch-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: govsearch-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
    restart: unless-stopped
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - govsearch-network

  # Helper service to automatically pull the model on first run
  ollama-init:
    image: ollama/ollama:latest
    container_name: govsearch-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Checking if model $${OLLAMA_MODEL} is available..."
        if ollama list | grep -q "$${OLLAMA_MODEL}"; then
          echo "Model $${OLLAMA_MODEL} already exists"
        else
          echo "Pulling model $${OLLAMA_MODEL}... (this may take several minutes)"
          ollama pull $${OLLAMA_MODEL}
          echo "Model $${OLLAMA_MODEL} pulled successfully"
        fi
        echo "Ollama setup complete!"
    networks:
      - govsearch-network
    restart: "no"

volumes:
  ollama_data:
    driver: local

networks:
  govsearch-network:
    driver: bridge
